# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site Settings
title: 邢小林的生活站点
name: &name 邢小林
description: >-
  南京生活、轻松办公、城市探索，记录生活中的美好与成长。
url: https://xiaolinstar.cn
baseurl: ""
author: *name
email: xiaolin@example.com
lang: zh-CN

# Theme
theme: hydejack
remote_theme: hydecorp/hydejack@v9

# Hydejack Configuration
accent_image: /assets/img/sidebar-bg.jpg
accent_color: '#4fb1ba'
google_fonts:
  - Noto+Sans+SC:wght@400;500;700

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins (loaded in GitHub Actions CI)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .bundle
  - vendor
  - node_modules
  - _drafts
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .git
  - .github
  - .vscode
  - .claude
  - .qoder
  - k8s
  - volumes
  - docker-compose.yaml
  - Dockerfile
  - nginx.conf
  - CLAUDE.md
  - README.md
  - docs
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - skills-lock.json

# Frontmatter Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: page
      toc: true
      show_author: true
      show_date: true
      comments: false
  -
    scope:
      path: "_posts"
    values:
      layout: post
      show_author: true
      show_date: true

# Hydejack Collections
collections:
  featured_categories:
    permalink: /:name/
    output: true
  featured_tags:
    permalink: /tag/:name/
    output: true
