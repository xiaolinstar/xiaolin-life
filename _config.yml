# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site Settings
title: 邢小林的生活站点
name: &name 邢小林
description: >-
  南京生活、轻松办公、城市探索，记录生活中的美好与成长。
url: https://xiaolinstar.cn
baseurl: ""
author: *name
email: xiaolin@example.com

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins (loaded in GitHub Actions CI)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .bundle
  - vendor
  - node_modules
  - _drafts
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .git
  - .github
  - .vscode
  - .claude
  - .qoder
  - k8s
  - volumes
  - docker-compose.yaml
  - Dockerfile
  - nginx.conf
  - CLAUDE.md
  - README.md
  - docs
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - skills-lock.json

# Frontmatter Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
      toc: true
      show-author: true
      show-date: true
      comments: false
  -
    scope:
      path: "_posts"
    values:
      layout: post
      show-author: true
      show-date: true
  -
    scope:
      path: "life"
    values:
      layout: page
      category: life
  -
    scope:
      path: "office"
    values:
      layout: page
      category: office

# Collections
collections:
  life:
    title: 生活
    output: true
    permalink: /life/:path/
  office:
    title: 办公
    output: true
    permalink: /office/:path/
  about:
    title: 关于
    output: true
    permalink: /about/
