# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site Settings
title: 邢小林的生活站点
name: &name 邢小林
description: >-
  南京生活、轻松办公、城市探索，记录生活中的美好与成长。
url: https://xiaolin.fun
baseurl: ""
author: *name
email: xiaolin@example.com
lang: zh-CN

# Timezone
timezone: Asia/Shanghai

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-aeo

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .bundle
  - vendor
  - node_modules
  - cert
  - _drafts
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .git
  - .github
  - .vscode
  - .claude
  - .qoder
  - k8s
  - volumes
  - compose.yaml
  - docker-compose.yaml
  - Dockerfile
  - nginx.conf
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - sre
  - package.json
  - skills-lock.json

# Frontmatter Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: page
