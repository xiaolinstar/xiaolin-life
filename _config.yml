# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site Settings
title: 邢小林的生活站点
name: &name 邢小林
description: >-
  南京生活、轻松办公、城市探索，记录生活中的美好与成长。
url: https://xiaolinstar.github.io
baseurl: "/xiaolin-life"
author: *name
email: xiaolin@example.com
lang: zh-CN

# Theme Configuration - Using remote_theme for GitHub Pages
# Note: Theme assets will be loaded from GitHub
remote_theme: kitian616/jekyll-TeXt-theme

text_skin: default
highlight_theme: default

# Navigation
navigation:
  - title: 首页
    url: /
  - title: 南京生活
    url: /life/nanjing/
  - title: 轻松办公
    url: /office/
  - title: 关于
    url: /about/

# Social Sites
github: xiaolinstar
# twitter: username
# weibo: username
# googleplus: username
# zhihu: username

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: Asia/Shanghai

# Plugins (supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .bundle
  - vendor
  - node_modules
  - _drafts
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .git
  - .github
  - .vscode
  - .claude
  - .qoder
  - k8s
  - volumes
  - docker-compose.yaml
  - Dockerfile
  - nginx.conf
  - CLAUDE.md
  - README.md
  - docs
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - skills-lock.json

# Frontmatter Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
