# ── A. 8080 port: container-internal HTTP only (healthcheck) ──
server {
    listen       127.0.0.1:8080;
    server_name  localhost;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~* \.(md|txt)$ {
        root   /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# ── B. 80 port: public HTTP, redirect to HTTPS ──
server {
    listen       80;
    server_name  xiaolin.fun www.xiaolin.fun;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── C. 443 port: public HTTPS main site ──
server {
    listen       443 ssl;
    http2 on;

    server_name  xiaolin.fun www.xiaolin.fun;

    ssl_certificate     /etc/nginx/certs/xiaolin.fun_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/xiaolin.fun.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~* \.(md|txt)$ {
        root   /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}