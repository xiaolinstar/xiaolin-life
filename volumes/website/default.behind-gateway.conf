# Behind xiaolin-gateway: container serves HTTP only.
# Gateway terminates TLS and proxies to host-published :8080.

# ── A. 8080: container-internal healthcheck (unchanged contract) ──
server {
    listen       127.0.0.1:8080;
    server_name  localhost;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~* \.(md|txt)$ {
        root   /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# ── B. 80: site content for gateway reverse-proxy ──
server {
    listen       80;
    server_name  xiaolin.fun www.xiaolin.fun _;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~* \.(md|txt)$ {
        root   /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
