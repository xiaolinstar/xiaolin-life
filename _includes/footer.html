<footer class="footer">
  <div class="footer__container">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
    <p>Powered by <a href="https://jekyllrb.com/">Jekyll</a></p>
    {% if site.data.icp.display %}
    <div class="footer__icp">
      <a href="{{ site.data.icp.icp.url }}" target="_blank" rel="noopener noreferrer">
        <span class="icp-icon">📝</span>
        {{ site.data.icp.icp.number }}
      </a>
      <span class="icp-divider">|</span>
      <a href="{{ site.data.icp.gongan.url }}" target="_blank" rel="noopener noreferrer">
        <span class="icp-icon">🛡️</span>
        公安联网备案: {{ site.data.icp.gongan.number }}
      </a>
    </div>
    {% endif %}
  </div>
</footer>
