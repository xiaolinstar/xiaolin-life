<footer class="footer">
  <div class="footer__container">
    <p class="footer__copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    <p class="footer__powered">Powered by <a href="https://jekyllrb.com/">Jekyll</a></p>
    {% if site.data.icp.display %}
    <div class="footer__icp">
      <a href="{{ site.data.icp.icp.url }}" target="_blank" rel="noopener noreferrer">
        {{ site.data.icp.icp.number }}
      </a>
      <span class="icp-divider">|</span>
      <a href="{{ site.data.icp.gongan.url }}" target="_blank" rel="noopener noreferrer">
        <img src="{{ "/assets/gonganlian.png" | relative_url }}" alt="公安联网备案" class="icp-icon-img">
        {{ site.data.icp.gongan.number }}
      </a>
    </div>
    {% endif %}
  </div>
</footer>
