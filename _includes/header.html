<header class="header">
  <div class="header__container">
    <div class="header__brand">
      <a href="{{ site.baseurl }}/">{{ site.title }}</a>
    </div>
    <nav class="header__nav">
      <a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>首页</a>
      <a href="{{ site.baseurl }}/life/" {% if page.url contains "life" %}class="active"{% endif %}>生活记录</a>
      <a href="{{ site.baseurl }}/office/" {% if page.url contains "office" %}class="active"{% endif %}>轻松办公</a>
      <a href="{{ site.baseurl }}/about/" {% if page.url contains "about" %}class="active"{% endif %}>关于</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    </nav>
  </div>
</header>
