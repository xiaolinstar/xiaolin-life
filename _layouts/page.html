---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%Y年%m月%d日" }}
    </time>
    {% if page.author %}
      &middot; {{ page.author }}
    {% endif %}
  </p>
  {% endif %}

  {{ content }}
</article>
