networks:
  tiny-sparrow-network:
    external: false

services:
  # Hugo 静态网站（站点内容打包在镜像内，nginx 配置通过本地挂载便于 git pull 更新）
  xiaolin-life-website:
    image: ghcr.io/xiaolinstar/xiaolin-life:main
    container_name: xiaolin-life-website
    volumes:
      - ./volumes/website/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/website/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/website/nginx-stub-status.conf:/etc/nginx/conf.d/nginx-stub-status.conf:ro
      - ./volumes/website/logs:/var/log/nginx
    networks:
      - tiny-sparrow-network
    ports:
      - "8081:8080"
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
