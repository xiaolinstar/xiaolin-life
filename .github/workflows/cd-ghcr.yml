name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline, Build Static Site"]
    types:
      - completed

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-life
  SITE_DIR: ~/AgentProjects/xiaolin-life/volumes/website/site

jobs:
  deploy-to-server:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Resolve CI run id
        id: ci-run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id=$(gh run list --workflow=ci-ghcr.yml --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          else
            run_id="${{ github.event.workflow_run.id }}"
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download static site artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci-run.outputs.run_id }}
          name: public-site
          path: public-site

      - name: Upload static site to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "public-site/*"
          target: ${{ env.SITE_DIR }}
          strip_components: 1
          overwrite: true
          rm: true
          timeout: 30m

      - name: Restart website container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            # 服务器仅托管静态产物，无需拉取 Blowfish submodule
            git -c submodule.recurse=false pull --ff-only
            mkdir -p volumes/website/site volumes/website/logs
            docker compose -f compose.yaml up -d
            docker image prune -f
            echo "Deployment completed successfully!"
