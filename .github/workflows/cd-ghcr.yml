name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline, Build and Push Image"]
    branches: [main]
    types:
      - completed

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-life

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: cd-xiaolin-fun-121
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Deploy matching configuration and image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            export WEBSITE_IMAGE_TAG="sha-$DEPLOY_SHA"
            # Confirm the image exists before changing the server configuration.
            docker pull "ghcr.nju.edu.cn/xiaolinstar/xiaolin-life:$WEBSITE_IMAGE_TAG"
            git -c submodule.recurse=false fetch origin main
            git -c submodule.recurse=false checkout --detach "$DEPLOY_SHA"
            mkdir -p volumes/website/logs volumes/website/certs
            docker compose -f compose.yaml up -d
            bash scripts/wait-healthy.sh
            docker image prune -f
            echo "Deployment completed successfully: $DEPLOY_SHA"
