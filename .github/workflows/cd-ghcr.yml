name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline, Build and Push Image"]
    types:
      - completed

concurrency:
  group: cd-xiaolin-fun
  cancel-in-progress: true

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-life

jobs:
  config-sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Sync repository on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            git -c submodule.recurse=false pull --ff-only
            mkdir -p volumes/website/logs

  deploy:
    needs: config-sync
    runs-on: ubuntu-latest

    steps:
      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml up -d
            docker image prune -f
            echo "Deployment completed successfully!"
