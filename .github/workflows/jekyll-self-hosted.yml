name: Jekyll Self-Hosted Deploy via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --config _config.yml,_config.self-hosted.yml
        env:
          JEKYLL_ENV: production

      - name: Create .nojekyll
        run: touch _site/.nojekyll

      - name: Prepare artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site

      - name: Upload site to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "_site/*"
          target: "/tmp/xiaolin-life-site"
          strip_components: 1
          rm: true

      - name: Publish site on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            WEBROOT="${{ secrets.SSH_TARGET_DIR || '/opt/xiaolin-life/volumes/jekyll/site' }}"
            mkdir -p "$WEBROOT"
            find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a /tmp/xiaolin-life-site/. "$WEBROOT"/
            chmod -R 755 "$WEBROOT"
            rm -rf /tmp/xiaolin-life-site
            echo "Deployment completed successfully at $(date)"
