name: Media URL Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'

permissions:
  contents: read

jobs:
  verify-media-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify remote media URLs in content
        run: |
          set -euo pipefail
          mapfile -t urls < <(rg -o 'https?://[^)\s"'"'"']+\.(jpg|jpeg|png|webp|gif|mp4|mov)' content --glob '*.md' -i || true)
          if [[ ${#urls[@]} -eq 0 ]]; then
            echo "No remote media URLs in content (still using local gallery/* is OK)."
            exit 0
          fi
          failed=0
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$url" || echo "000")
            if [[ "$code" == "200" || "$code" == "206" ]]; then
              echo "✓ $code $url"
            else
              echo "✗ $code $url"
              failed=1
            fi
          done
          exit $failed
