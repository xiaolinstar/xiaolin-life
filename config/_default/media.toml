# 媒体 CDN 配置（可选）
# 启用后：媒体走腾讯云 COS + CDN；gallery / static 大图不进 Git（见 docs/MEDIA-STANDARDS.md）。
# GitHub Variables：MEDIA_CDN_BASE；CDN 未配前可用 COS 直链。

[media]
  # 例：https://media.xiaolin.fun；留空则仍从站点同源加载
  cdnBaseURL = "https://media.xiaolin.fun"

  # Markdown / 短代码中的相对媒体路径前缀（迁移完成后统一改引用）
  localPrefix = "/assets/images/"
