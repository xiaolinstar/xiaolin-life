# 媒体 CDN 配置（可选）
# 启用后：图片上传腾讯云 COS + CDN，构建/部署包不再包含 static/assets/images 与 gallery 大图。
# 在 GitHub repo Variables 设置 MEDIA_CDN_BASE，或在本地 export 后构建。

[media]
  # 例：https://media.xiaolin.fun；留空则仍从站点同源加载
  cdnBaseURL = "https://media.xiaolin.fun"

  # Markdown / 短代码中的相对媒体路径前缀（迁移完成后统一改引用）
  localPrefix = "/assets/images/"
